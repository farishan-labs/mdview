<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --code-bg: #f1f3f5;
    --border: #e5e7eb;
    --sidebar-bg: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e2e;
      --fg: #cdd6f4;
      --muted: #a6adc8;
      --accent: #89b4fa;
      --code-bg: #313244;
      --border: #45475a;
      --sidebar-bg: #181825;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Inter", "Ubuntu", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; height: 100vh; overflow: hidden;
  }
  aside#toc {
    width: 280px; min-width: 280px; background: var(--sidebar-bg);
    border-right: 1px solid var(--border); padding: 1.25rem 1rem;
    overflow-y: auto; transition: margin-left .2s ease; 
  }
  aside#toc.collapsed { margin-left: -280px; }
  aside#toc h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .75rem; }
  aside#toc ul { list-style: none; padding: 0; margin: 0; }
  aside#toc li { margin: .25rem 0; }
  aside#toc a { color: var(--fg); text-decoration: none; font-size: .9rem; display: block; padding: .2rem .4rem; border-radius: .3rem; }
  aside#toc a:hover { background: var(--border); color: var(--accent); }
  aside#toc .l2 { padding-left: 1.2rem; font-size: .85rem; }
  aside#toc .l3 { padding-left: 2.2rem; font-size: .8rem; color: var(--muted); }

  main { flex: 1; overflow-y: auto; padding: 2.5rem 3rem; }
  .content { max-width: 820px; margin: 0 auto; line-height: 1.7; font-size: 1.05rem; }
  h1, h2, h3, h4 { line-height: 1.3; margin-top: 2rem; }
  h1 { font-size: 2.1rem; border-bottom: 1px solid var(--border); padding-bottom: .4rem; }
  h2 { font-size: 1.55rem; }
  h3 { font-size: 1.25rem; }
  a { color: var(--accent); }
  code { background: var(--code-bg); padding: .15em .35em; border-radius: .3rem; font-size: .9em; font-family: "JetBrains Mono", "Ubuntu Mono", monospace; }
  pre { background: var(--code-bg); padding: 1rem; border-radius: .5rem; overflow-x: auto; border: 1px solid var(--border); }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 3px solid var(--accent); margin-left: 0; padding-left: 1rem; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border: 1px solid var(--border); padding: .5rem .75rem; }
  th { background: var(--code-bg); }
  img { max-width: 100%; height: auto; border-radius: .4rem; }

  #searchbar {
    position: fixed; top: 1rem; right: 1rem; display: none;
    background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: .5rem;
    padding: .4rem .6rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 10;
  }
  #searchbar input { background: transparent; border: none; outline: none; color: var(--fg); font-size: .95rem; width: 220px; }
  #hint {
    position: fixed; bottom: 1rem; right: 1rem; font-size: .75rem; color: var(--muted);
    background: var(--sidebar-bg); border: 1px solid var(--border); padding: .3rem .6rem; border-radius: .4rem;
  }
</style>
</head>
<body>
  <aside id="toc" class="collapsed">
    <h2>Contents</h2>
    <ul>{{toc}}</ul>
  </aside>
  <main>
    <article class="content">{{content}}</article>
  </main>
  <div id="searchbar"><input id="q" type="search" placeholder="Search… (Enter next)"></div>
  <div id="hint">t: TOC · /: search · Esc: close</div>
  <script>
    const toc = document.getElementById('toc');
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { /* handled by host */ }
      if (e.key === 't' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') {
        toc.classList.toggle('collapsed');
      }
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchbar').style.display = 'block';
        document.getElementById('q').focus();
      }
    });
    const q = document.getElementById('q');
    q.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const found = window.find(q.value, false, e.shiftKey, true, false, false, false);
        if (!found) window.find(q.value, false, false, true, false, false, false);
      }
      if (e.key === 'Escape') {
        document.getElementById('searchbar').style.display = 'none';
        q.value = '';
      }
    });
    // open TOC by default if content long
    if (document.querySelectorAll('aside#toc li').length > 3) {
      toc.classList.remove('collapsed');
    }
  </script>
</body>
</html>
